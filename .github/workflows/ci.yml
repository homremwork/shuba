name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint-and-release-tools:
    name: Lint and release-tool tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out recursive sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          jq libarchive-tools shellcheck xmlstarlet
      - name: Install Fish 4
        uses: fish-actions/install-fish@4bb37a71daebb76c6fb7d83771cff31b8a78c28e # v1.2.0
      - name: Enforce Fish release contract
        shell: fish {0}
        run: |
          source tools/release/lib/core.fish
          source tools/release/lib/release-contract.fish
          shuba_contract_load release/release.properties
          shuba_require_fish_version (shuba_contract_get tool.fish_min_version)
          fish --version
      - name: Run workflow and repository lint
        run: tools/ci/lint-ci.fish
      - name: Run hermetic release-tool tests
        run: tools/ci/run-release-tool-tests.fish --hermetic

  host-libjxl:
    name: Host libjxl cache
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - name: Check out recursive sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ninja-build pkg-config
      - name: Install Fish 4
        uses: fish-actions/install-fish@4bb37a71daebb76c6fb7d83771cff31b8a78c28e # v1.2.0
      - name: Enforce Fish release contract
        shell: fish {0}
        run: |
          source tools/release/lib/core.fish
          source tools/release/lib/release-contract.fish
          shuba_contract_load release/release.properties
          shuba_require_fish_version (shuba_contract_get tool.fish_min_version)
      - name: Calculate host libjxl fingerprint
        id: fingerprint
        shell: fish {0}
        run: echo "value="(tools/ci/build-libjxl-host.fish --print-fingerprint) >>$GITHUB_OUTPUT
      - name: Restore host libjxl
        id: cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            build/ci/libjxl-host-build
            build/ci/libjxl-host-prefix
          key: host-libjxl-ubuntu-24.04-${{ steps.fingerprint.outputs.value }}
      - name: Build or validate host libjxl
        run: tools/ci/build-libjxl-host.fish
      - name: Read-only host libjxl validation
        run: tools/ci/build-libjxl-host.fish --check

  host-tests:
    name: GCC host tests and localization
    needs: host-libjxl
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out recursive sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          catch2 gettext libasound2-dev libfontconfig1-dev libfreetype-dev
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev
          libxi-dev libxrandr-dev libxrender-dev ninja-build pkg-config
      - name: Install Fish 4
        uses: fish-actions/install-fish@4bb37a71daebb76c6fb7d83771cff31b8a78c28e # v1.2.0
      - name: Restore host libjxl
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            build/ci/libjxl-host-build
            build/ci/libjxl-host-prefix
          key: host-libjxl-ubuntu-24.04-${{ needs.host-libjxl.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Validate host dependency
        run: tools/ci/build-libjxl-host.fish --check
      - name: Configure and build
        run: cmake --preset ci-host && cmake --build --preset ci-host
      - name: Validate localization
        run: cmake --build build/ci/ci-host --target shuba_validate_localization
      - name: Run all registered tests
        run: ctest --preset ci-host

  asan:
    name: GCC AddressSanitizer
    needs: host-libjxl
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out recursive sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Install host dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          catch2 gettext libasound2-dev libfontconfig1-dev libfreetype-dev
          libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev
          libxi-dev libxrandr-dev libxrender-dev ninja-build pkg-config
      - name: Install Fish 4
        uses: fish-actions/install-fish@4bb37a71daebb76c6fb7d83771cff31b8a78c28e # v1.2.0
      - name: Restore host libjxl
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            build/ci/libjxl-host-build
            build/ci/libjxl-host-prefix
          key: host-libjxl-ubuntu-24.04-${{ needs.host-libjxl.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Configure, build, and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
        run: cmake --preset ci-asan && cmake --build --preset ci-asan && ctest --preset ci-asan

  static-analysis:
    name: Clang-Tidy and Cppcheck
    needs: host-libjxl
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out recursive sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Install analyzer dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          catch2 clang-tidy-18 cppcheck gettext libasound2-dev libfontconfig1-dev
          libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev
          libxi-dev libxinerama-dev libxrandr-dev libxrender-dev ninja-build pkg-config
      - name: Install Fish 4
        uses: fish-actions/install-fish@4bb37a71daebb76c6fb7d83771cff31b8a78c28e # v1.2.0
      - name: Restore host libjxl
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            build/ci/libjxl-host-build
            build/ci/libjxl-host-prefix
          key: host-libjxl-ubuntu-24.04-${{ needs.host-libjxl.outputs.fingerprint }}
          fail-on-cache-miss: true
      - name: Configure compile database and generated resources
        run: >-
          cmake --preset ci-static
          -DSHUBA_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-18
          -DSHUBA_RUN_CLANG_TIDY_EXECUTABLE=/usr/bin/run-clang-tidy-18
          '-DSHUBA_CLANG_TIDY_EXTRA_ARGS=-extra-arg=-D__cpp_concepts=202002L;-extra-arg=-Wno-builtin-macro-redefined;-extra-arg=-Xclang;-extra-arg=-analyzer-config;-extra-arg=-Xclang;-extra-arg=c++-allocator-inlining=false'
          && cmake --build --preset ci-static
      - name: Run standalone analyzers
        run: cmake --build build/ci/ci-static --target shuba_static_checks

  dispatch-release-candidate:
    name: Dispatch release candidate
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint-and-release-tools, host-libjxl, host-tests, asan, static-analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the verified tag to the Android release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SHUBA_CI_RUN_ID: ${{ github.run_id }}
          SHUBA_TAG: ${{ github.ref_name }}
          SHUBA_TAG_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $SHUBA_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SHUBA_TAG}")
          [[ $(jq -r '.object.type' <<<"$tag_ref") == tag ]]
          tag_object=$(jq -r '.object.sha' <<<"$tag_ref")
          [[ $tag_object =~ ^[0-9a-f]{40,64}$ ]]
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches" \
            -f ref=master \
            -f 'inputs[operation]=candidate' \
            -f "inputs[tag]=${SHUBA_TAG}" \
            -f "inputs[ci_run_id]=${SHUBA_CI_RUN_ID}" \
            -f "inputs[tag_commit]=${SHUBA_TAG_COMMIT}" \
            -f "inputs[tag_object]=${tag_object}"
