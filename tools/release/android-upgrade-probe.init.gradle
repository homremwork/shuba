// Isolated code-2 upgrade-probe injection for the disposable JUCE Android project.
// This script is loaded only by build-android-upgrade-probe.fish. It never changes
// tracked authority or generated output, and it selects only release_Release.

final String expectedBuildType = 'release'
final String expectedFlavorDimension = 'default'
final String expectedFlavorName = 'release_'
final String expectedVariantName = 'release_Release'
final List<String> requiredProbeProperties = [
    'shubaUpgradeProbeApplicationId',
    'shubaUpgradeProbeVersionCode',
]

String requiredProbeProperty(Project project, String propertyName) {
    final Object value = project.findProperty(propertyName)
    if (!(value instanceof String) || value.isEmpty()) {
        throw new GradleException("Shuba upgrade probe requires Gradle property '${propertyName}'.")
    }
    return value
}

int requiredPositiveInteger(String propertyName, String value) {
    if (!(value ==~ /^[1-9][0-9]*$/)) {
        throw new GradleException("Shuba upgrade probe property '${propertyName}' must be a positive decimal integer.")
    }
    return Integer.parseInt(value)
}

gradle.beforeProject { Project project ->
    if (project.path != ':app') {
        return
    }

    project.pluginManager.withPlugin('com.android.application') {
        final Map<String, String> probeProperties = [:]
        requiredProbeProperties.each { String propertyName ->
            probeProperties[propertyName] = requiredProbeProperty(project, propertyName)
        }
        final String expectedApplicationId = probeProperties.shubaUpgradeProbeApplicationId
        final int upgradeProbeVersionCode = requiredPositiveInteger(
            'shubaUpgradeProbeVersionCode',
            probeProperties.shubaUpgradeProbeVersionCode,
        )
        final Object androidComponentsExtension = project.extensions.findByName('androidComponents')
        if (androidComponentsExtension == null) {
            throw new GradleException('Shuba upgrade probe could not find the Android Components extension.')
        }

        // Register variant mutation while the application plugin is applied and
        // before AGP starts variant creation. This selects only release_Release;
        // no default-config, build-type, or other variant property is modified.
        final Object selector = androidComponentsExtension.selector()
            .withBuildType(expectedBuildType)
            .withFlavor(expectedFlavorDimension, expectedFlavorName)
        androidComponentsExtension.onVariants(selector) { Object variant ->
            if (variant.name != expectedVariantName) {
                throw new GradleException(
                    "Shuba upgrade probe selected unexpected variant '${variant.name}'."
                )
            }

            int outputCount = 0
            variant.outputs.each { Object output ->
                output.versionCode.set(upgradeProbeVersionCode)
                outputCount += 1
            }
            if (outputCount != 1) {
                throw new GradleException(
                    "Shuba upgrade probe requires one APK output, found ${outputCount}."
                )
            }
        }

        // This callback runs after JUCE has defined its generated DSL. It proves
        // the override starts from code-1 project authority rather than replacing
        // tracked identity or generated source state.
        androidComponentsExtension.finalizeDsl { Object androidExtension ->
            if (androidExtension.defaultConfig.applicationId != expectedApplicationId) {
                throw new GradleException(
                    "Shuba upgrade probe refuses unexpected application ID '${androidExtension.defaultConfig.applicationId}'."
                )
            }
            final Object sourceVersionCode = androidExtension.defaultConfig.versionCode
            if (!(sourceVersionCode instanceof Integer) || sourceVersionCode <= 0) {
                throw new GradleException('Shuba upgrade probe requires one positive generated source version code.')
            }
            if (upgradeProbeVersionCode != sourceVersionCode + 1) {
                throw new GradleException('Shuba upgrade probe version code must be exactly one greater than source version code.')
            }
            final Object sourceVersionName = androidExtension.defaultConfig.versionName
            if (!(sourceVersionName instanceof String) || sourceVersionName.isEmpty()) {
                throw new GradleException('Shuba upgrade probe requires a non-empty generated source version name.')
            }
        }
    }
}
